<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Online Shopping</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="#home">
                ShopEase
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#home">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#products">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>

                </ul>

                <button class="btn btn-warning ms-lg-3" id="cartButton">
                    Cart (<span id="cartCount">0</span>)
                </button>

            </div>

        </div>

    </nav>


    <!-- HERO SECTION -->
    <section class="hero" id="home">

        <div class="container text-center">

            <h1>Welcome to ShopEase</h1>

            <p>
                Discover Amazing Products at Best Prices
            </p>

            <a href="#products" class="btn btn-primary">
                Shop Now
            </a>

        </div>

    </section>


    <!-- PRODUCTS SECTION -->
    <section class="container my-5" id="products">

        <h2 class="text-center mb-4">
            Our Products
        </h2>

        <div class="row g-4">


            <!-- PRODUCT 1 -->
            <div class="col-md-4">

                <div class="card product-card h-100">

                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" class="card-img-top"
                        alt="Smart Watch">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Smart Watch
                        </h5>

                        <p class="price">
                            Rs. 5,000
                        </p>

                        <button class="btn btn-primary add-cart" data-name="Smart Watch" data-price="5000">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>


            <!-- PRODUCT 2 -->
            <div class="col-md-4">

                <div class="card product-card h-100">

                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" class="card-img-top"
                        alt="Headphones">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Headphones
                        </h5>

                        <p class="price">
                            Rs. 3,500
                        </p>

                        <button class="btn btn-primary add-cart" data-name="Headphones" data-price="3500">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>


            <!-- PRODUCT 3 -->
            <div class="col-md-4">

                <div class="card product-card h-100">

                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" class="card-img-top"
                        alt="Shoes">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Shoes
                        </h5>

                        <p class="price">
                            Rs. 4,000
                        </p>

                        <button class="btn btn-primary add-cart" data-name="Shoes" data-price="4000">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>


        </div>

    </section>


    <!-- CONTACT SECTION -->
    <section class="container my-5" id="contact">

        <h2 class="text-center mb-4">
            Contact Us
        </h2>

        <form id="contactForm">

            <!-- NAME -->
            <div class="mb-3">

                <label for="name" class="form-label">
                    Your Name
                </label>

                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>

            </div>


            <!-- EMAIL -->
            <div class="mb-3">

                <label for="email" class="form-label">
                    Email Address
                </label>

                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>

            </div>


            <!-- MESSAGE -->
            <div class="mb-3">

                <label for="message" class="form-label">
                    Message
                </label>

                <textarea class="form-control" id="message" rows="4" placeholder="Enter your message"
                    required></textarea>

            </div>


            <button type="submit" class="btn btn-success">
                Submit
            </button>

            <p id="formMessage" class="mt-3"></p>

        </form>

    </section>


    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-3">

        <p class="mb-0">
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </footer>


    <!-- BOOTSTRAP JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- CUSTOM JAVASCRIPT -->
    <script src="script.js"></script>


</body>

</html>
